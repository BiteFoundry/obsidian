[package]
name = "obsidian-cli"
version = "0.4.8"
edition = "2021"
description = "Obsidian-native terminal workspace, interactive knowledge graph & AI agent toolkit — Local Vaults, Backlinks, Graph View, CLI, TUI, HTTP API & MCP"
license = "MIT"
repository = "https://github.com/BiteFoundry/obsidian"

[lib]
name = "obsidian_cli"
path = "src/lib.rs"

[[bin]]
name = "bitefoundry-obsidian"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arboard = { version = "3", features = ["image-data"] }
axum = "0.8"
base64 = "0.22"
bitefoundry-html = { git = "https://github.com/BiteFoundry/bitefoundry-html", rev = "4d9f94b14c8a8b9a8775b630af4510483e0efe45" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
notify = "8"
open = "5"
percent-encoding = "2"
rand = "0.8"
ratatui = "0.28"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tree-sitter = "0.26"
tree-sitter-yaml = "0.7.2"
unicode-width = "0.2"
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
